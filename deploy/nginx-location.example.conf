# Example nginx snippet for the trip journal API. Placeholders only.
#
# In the http {} block (once):
#   limit_req_zone $binary_remote_addr zone=trip_api:10m rate=10r/s;
#
# In the TLS server {} block for TRIP_ORIGIN's host. Replace <random-path> with the same random
# segment as TRIP_COOKIE_PATH (/onetrip/<random-path>/) and the app's endpoint URL.
location ^~ /onetrip/<random-path>/ {
    limit_req zone=trip_api burst=40 nodelay;
    # Ticket attachments are up to 10 MB each, plus request overhead.
    client_max_body_size 12m;

    # The server trusts X-Real-IP only from loopback (touch pairing rate limits use it).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;

    # The trailing slash strips the prefix: /onetrip/<random-path>/api/plan -> /api/plan.
    proxy_pass http://127.0.0.1:8765/;
}
