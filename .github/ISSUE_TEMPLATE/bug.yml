name: 问题反馈 / Bug report
description: App、脚本或文档有错误 / Something in the app, scripts or docs is wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请勿贴出行程、住址、证件号、订单号、签名配置或密钥。Please do not paste itineraries, addresses, IDs, booking references, signing settings or keys.
  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / What happened
      description: 期望的结果和实际结果 / Expected vs. actual
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: "1. make content\n2. …"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境 / Environment
      placeholder: macOS 26.x, Xcode 26.x, iPhone 17 Pro simulator (iOS 26.x), Python 3.12
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 输出或截图 / Output or screenshots
      render: shell
