name: TripJournal
options:
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Debug:
      APNS_ENVIRONMENT: development
    Release:
      APNS_ENVIRONMENT: production
configFiles:
  Debug: App.xcconfig
  Release: App.xcconfig
targets:
  TripJournal:
    type: application
    platform: iOS
    sources:
      - path: TripJournal
        excludes: [Resources]
      # Generated by scripts/build_ios_resources.py; run it before xcodegen.
      - path: TripJournal/Resources/Content
        type: folder
        buildPhase: resources
      - path: TripJournal/Resources/Assets.xcassets
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TripJournal/Info.plist
        CODE_SIGN_ENTITLEMENTS: TripJournal/TripJournal.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: TripWidgets
    scheme:
      testTargets: [TripJournalTests]
  TripWidgets:
    type: app-extension
    platform: iOS
    sources:
      - TripWidgets
      - TripJournal/Shared
      - path: TripJournal/Resources/Content/trip.json
        buildPhase: resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TripWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: TripWidgets/TripWidgets.entitlements
        SKIP_INSTALL: YES
  TripJournalTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TripJournalTests]
    dependencies:
      - target: TripJournal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
  # UI tests that only capture screenshots (scripts/make_screenshots.py); run via the Screenshots scheme.
  TripJournalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TripJournalUITests]
    dependencies:
      - target: TripJournal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        TEST_TARGET_NAME: TripJournal
schemes:
  Screenshots:
    build:
      targets:
        TripJournal: all
        TripJournalUITests: [test]
    test:
      config: Debug
      targets: [TripJournalUITests]
